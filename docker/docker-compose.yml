services:
  # Whatomate app + resident realtime media engine.
  # The media engine intentionally lives in the same process/container as the
  # call session manager: no extra container hop, no Redis round-trip in the RTP
  # path, and no cold media worker startup on an incoming call.
  app:
    image: shridh0r/whatomate:latest
    container_name: whatomate_app
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "8080:8080"
      # WebRTC media (calling). Must match calling.udp_port_min/max in
      # config.toml (or WHATOMATE_CALLING__UDP_PORT_MIN/MAX).
      - "10000-10999:10000-10999/udp"
    networks:
      - whatomate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
      # IVR/hold/ringback media is persistent and is pre-parsed into the
      # resident Opus packet cache when the process starts.
      - ./audio:/app/audio:rw
      - ./config.toml:/app/config.toml:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "autoheal=true"

  # Restarts the app if its health endpoint becomes unresponsive.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: whatomate_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  db:
    image: postgres:17-alpine
    container_name: whatomate_db
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatomate}
      POSTGRES_DB: ${POSTGRES_DB:-whatomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatomate} -d ${POSTGRES_DB:-whatomate}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: whatomate_redis
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Redis persistence remains enabled; host vm.overcommit_memory=1 should
      # also be configured to avoid fork failures during background saves.
      REDIS_ARGS: "--appendonly yes"
    command: ["sh", "-c", "redis-server $$REDIS_ARGS"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

networks:
  whatomate:

volumes:
  postgres-data:
  redis-data:
