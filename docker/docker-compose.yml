services:
  # Whatomate app
  app:
    image: shridh0r/whatomate:latest
    container_name: whatomate_app
    restart: unless-stopped
    ports:
      - "8080:8080"
      # WebRTC media (calling). Must match calling.udp_port_min/max in
      # config.toml (or WHATOMATE_CALLING__UDP_PORT_MIN/MAX). Without this
      # published, direct (non-relay) call media has no path in from the
      # internet and every call falls back to relay_only or fails.
      - "10000-10999:10000-10999/udp"
    networks:
      - whatomate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
      - ./config.toml:/app/config.toml:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]
    # If the process hangs (deadlock, stuck goroutine, DB pool exhaustion)
    # without actually exiting, `restart: unless-stopped` alone won't help —
    # Docker only restarts on process exit. This healthcheck lets Docker
    # detect an unresponsive server and restart the container automatically,
    # so IVR/calling stays available without manual intervention.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "autoheal=true"

  # Docker's own healthcheck only reports status — it does NOT restart an
  # "unhealthy" container by itself (restart policies only fire on process
  # exit). This sidecar watches containers labeled autoheal=true and force
  # -restarts them the moment they go unhealthy, which is what actually
  # gives you "always available" self-healing without a human restarting
  # the box after a stuck call wedges the process.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: whatomate_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: whatomate_db
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatomate}
      POSTGRES_DB: ${POSTGRES_DB:-whatomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatomate} -d ${POSTGRES_DB:-whatomate}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: whatomate_redis
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

networks:
  whatomate:

volumes:
  postgres-data:
  redis-data:
