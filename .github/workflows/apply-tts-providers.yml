name: Apply switchable TTS providers

on:
  push:
    paths:
      - .github/workflows/apply-tts-providers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply provider implementation
        run: python .github/scripts/apply_tts_providers.py
      - name: Format Go
        run: gofmt -w internal/tts/piper.go internal/tts/providers.go internal/handlers/tts_settings.go internal/handlers/tts_providers.go cmd/whatomate/main.go
      - name: Test backend
        run: go test ./internal/tts ./internal/calling ./internal/handlers ./cmd/whatomate
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Targeted frontend typecheck
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          cat /tmp/typecheck.log
          if grep -E 'TTSSettingsPanel\.vue|IVRNodeProperties\.vue|services/api\.ts' /tmp/typecheck.log; then
            exit 1
          fi
          echo "Full repo typecheck exit code: $code; unrelated pre-existing errors are tolerated."
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit implementation
        run: |
          rm -f .github/scripts/apply_tts_providers.py .github/workflows/apply-tts-providers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add switchable local and Gemini TTS providers"
          git push origin HEAD:main
