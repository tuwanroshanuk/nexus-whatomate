name: Apply stable IVR lifecycle fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ivr-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply lifecycle and concurrency fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          session = "internal/calling/session.go"

          replace_once(session, '''func (m *Manager) HandleIncomingCall(account *models.WhatsAppAccount, contact *models.Contact, callLog *models.CallLog, sdpOffer string, stickyAgentID *uuid.UUID) {
          	// A caller may redial before Meta delivers the previous terminate event.
          	// Cancel and remove every older session for this caller/account first so
          	// stale media-timeout goroutines cannot terminate or interfere with the
          	// new call. Every incoming call therefore starts from a clean IVR state.
          	m.resetCallerSessions(account.OrganizationID, account.Name, contact.PhoneNumber, callLog.WhatsAppCallID)
          	callCtx, callCancel := context.WithCancel(context.Background())
          ''', '''func (m *Manager) HandleIncomingCall(account *models.WhatsAppAccount, contact *models.Contact, callLog *models.CallLog, sdpOffer string, stickyAgentID *uuid.UUID) {
          	// Meta may retry the same connect webhook. Never replace a live session
          	// with another object carrying the same call ID; late goroutines from the
          	// first object could otherwise close the replacement.
          	if existing := m.GetSession(callLog.WhatsAppCallID); existing != nil {
          		m.log.Info("Ignoring duplicate incoming call connect event", "call_id", callLog.WhatsAppCallID)
          		return
          	}

          	// Remove only sessions that are demonstrably stale. Active calls from the
          	// same caller are allowed to coexist and delayed webhook delivery cannot
          	// terminate the newer call.
          	m.resetCallerSessions(account.OrganizationID, account.Name, contact.PhoneNumber, callLog.WhatsAppCallID)
          	callCtx, callCancel := context.WithCancel(context.Background())
          ''')

          replace_once(session, '''	// Start WebRTC negotiation using the consumer's SDP offer
          	go m.negotiateWebRTC(session, account, sdpOffer)
          ''', '''	// Start WebRTC negotiation using the consumer's SDP offer.
          	m.safeGo("negotiateWebRTC", session.ID, func() {
          		m.negotiateWebRTC(session, account, sdpOffer)
          	})
          ''')

          replace_once(session, '''	case "cleanup":
          		go m.cleanupSession(callID)
          ''', '''	case "cleanup":
          		m.endSession(session, "remote_call_ended", "HandleCallEvent")
          ''')

          replace_once(session, '''// EndCall terminates a call session and cleans up resources
          func (m *Manager) EndCall(callID string) {
          	if session := m.GetSession(callID); session != nil {
          		session.mu.Lock()
          		if session.Cancel != nil {
          			session.Cancel()
          		}
          		session.Status = models.CallStatusCompleted
          		session.mu.Unlock()
          	}
          	m.cleanupSession(callID)
          }
          ''', '''// EndCall terminates the currently registered call session.
          // Legacy call sites may only have a call ID, so resolve the concrete
          // session first and delegate to the identity-safe, idempotent owner.
          func (m *Manager) EndCall(callID string) {
          	m.endCurrentSessionByID(callID, "legacy_end_call", "EndCall")
          }
          ''')

          replace_once(session, '''// resetCallerSessions removes older sessions for the same caller before a redial.
          func (m *Manager) resetCallerSessions(orgID uuid.UUID, accountName, callerPhone, keepCallID string) {
          	m.mu.RLock()
          	var stale []*CallSession
          	for id, session := range m.sessions {
          		if id != keepCallID && session.OrganizationID == orgID && session.AccountName == accountName && session.CallerPhone == callerPhone {
          			stale = append(stale, session)
          		}
          	}
          	m.mu.RUnlock()

          	for _, session := range stale {
          		session.mu.Lock()
          		if session.Cancel != nil {
          			session.Cancel()
          		}
          		session.Status = models.CallStatusCompleted
          		if session.TransferStatus == models.CallTransferStatusWaiting {
          			session.TransferStatus = models.CallTransferStatusAbandoned
          		}
          		session.mu.Unlock()
          		m.log.Info("Resetting stale caller session before redial", "old_call_id", session.ID, "new_call_id", keepCallID)
          		m.cleanupSession(session.ID)
          	}
          }
          ''', '''// resetCallerSessions removes only demonstrably dead sessions for the same
          // caller. A second live call or an out-of-order connect webhook must never
          // tear down an active call that already has media in progress.
          func (m *Manager) resetCallerSessions(orgID uuid.UUID, accountName, callerPhone, keepCallID string) {
          	m.mu.RLock()
          	candidates := make([]*CallSession, 0)
          	for id, session := range m.sessions {
          		if id != keepCallID && session.OrganizationID == orgID && session.AccountName == accountName && session.CallerPhone == callerPhone {
          			candidates = append(candidates, session)
          		}
          	}
          	m.mu.RUnlock()

          	for _, session := range candidates {
          		session.mu.Lock()
          		age := time.Since(session.StartedAt)
          		peer := session.PeerConnection
          		ctxDone := false
          		if session.Context != nil {
          			select {
          			case <-session.Context.Done():
          				ctxDone = true
          			default:
          			}
          		}
          		terminalPeer := peer != nil && isTerminalPeerState(peer)
          		session.mu.Unlock()

          		if !ctxDone && !terminalPeer && age <= 90*time.Second {
          			m.log.Info("Keeping active caller session during redial",
          				"old_call_id", session.ID,
          				"new_call_id", keepCallID,
          				"age_secs", int(age.Seconds()),
          			)
          			continue
          		}

          		m.log.Info("Cleaning stale caller session before redial",
          			"old_call_id", session.ID,
          			"new_call_id", keepCallID,
          			"age_secs", int(age.Seconds()),
          		)
          		m.endSession(session, "stale_redial_session", "resetCallerSessions")
          	}
          }
          ''')

          webrtc = "internal/calling/webrtc.go"
          p = Path(webrtc)
          text = p.read_text()
          text = text.replace('''		if state == webrtc.PeerConnectionStateFailed || state == webrtc.PeerConnectionStateClosed {
          			m.EndCall(session.ID)
          		}
          ''', '''		// State callbacks only publish events. Cleanup has one owner in
          		// endSession; calling it synchronously here makes Close() re-entrant.
          ''', 1)
          if text.count('m.EndCall(session.ID)') == 0:
              raise SystemExit("webrtc.go: expected EndCall call sites")
          text = text.replace('m.EndCall(session.ID)', 'm.endSession(session, "webrtc_terminal", "negotiateWebRTC")')
          text = text.replace('stateEvents := make(chan webrtc.PeerConnectionState, 8)', 'stateEvents := make(chan webrtc.PeerConnectionState, 16)', 1)
          text = text.replace('''			go m.handleDTMFTrack(session, track)
          ''', '''			m.safeGo("handleDTMFTrack", session.ID, func() {
          				m.handleDTMFTrack(session, track)
          			})
          ''', 1)
          text = text.replace('''		go m.consumeAudioWithDTMF(session, track)
          ''', '''		m.safeGo("consumeAudioWithDTMF", session.ID, func() {
          			m.consumeAudioWithDTMF(session, track)
          		})
          ''', 1)

          old_stabilize = '''	// Brief delay to ensure the selected ICE path remains stable before audio.
          	stabilize := time.NewTimer(750 * time.Millisecond)
          	defer stabilize.Stop()
          	select {
          	case <-ctx.Done():
          		return
          	case state := <-stateEvents:
          		if state == webrtc.PeerConnectionStateFailed || state == webrtc.PeerConnectionStateClosed {
          			m.log.Error("WebRTC peer closed during media stabilization", "call_id", session.ID, "state", state.String())
          			m.terminateCall(session, waAccount)
          			m.endSession(session, "webrtc_terminal", "negotiateWebRTC")
          			return
          		}
          	case <-stabilize.C:
          	}
          '''
          new_stabilize = '''	// Brief delay to ensure the selected ICE path remains stable before audio.
          	// Ignore queued non-terminal state events instead of letting them bypass
          	// the entire stabilization interval.
          	stabilize := time.NewTimer(500 * time.Millisecond)
          	defer stabilize.Stop()
          stabilizeLoop:
          	for {
          		select {
          		case <-ctx.Done():
          			return
          		case state := <-stateEvents:
          			if state == webrtc.PeerConnectionStateFailed || state == webrtc.PeerConnectionStateClosed {
          				m.log.Error("WebRTC peer closed during media stabilization", "call_id", session.ID, "state", state.String())
          				m.terminateCall(session, waAccount)
          				m.endSession(session, "webrtc_terminal", "negotiateWebRTC")
          				return
          			}
          		case <-stabilize.C:
          			break stabilizeLoop
          		}
          	}
          '''
          if old_stabilize not in text:
              raise SystemExit("webrtc.go: stabilization block not found")
          text = text.replace(old_stabilize, new_stabilize, 1)

          old_tail = '''	if session.StickyAgentID != nil {
          		go m.initiateTransfer(session, session.AccountName, "", nil)
          		return
          	}

          	// Start IVR flow if configured
          	if session.IVRFlow != nil {
          		go m.runIVRFlow(session, waAccount)
          	}
          }

          // waitForICEGathering waits for ICE gathering to complete on a PeerConnection
          '''
          new_tail = '''	if session.StickyAgentID != nil {
          		m.safeGo("initiateTransfer", session.ID, func() {
          			m.initiateTransfer(session, session.AccountName, "", nil)
          		})
          	} else if session.IVRFlow != nil {
          		m.safeGo("runIVRFlow", session.ID, func() {
          			m.runIVRFlow(session, waAccount)
          		})
          	}

          	// Negotiation used to return here, leaving no owner for disconnect or
          	// failure events after IVR started. Keep a dedicated monitor alive.
          	m.safeGo("monitorPeerConnection", session.ID, func() {
          		m.monitorPeerConnection(session, stateEvents, waAccount)
          	})
          }

          func (m *Manager) monitorPeerConnection(session *CallSession, stateEvents <-chan webrtc.PeerConnectionState, waAccount *whatsapp.Account) {
          	ctx := session.Context
          	if ctx == nil {
          		ctx = context.Background()
          	}

          	var disconnectTimer *time.Timer
          	var disconnectC <-chan time.Time
          	stopDisconnectTimer := func() {
          		if disconnectTimer == nil {
          			return
          		}
          		if !disconnectTimer.Stop() {
          			select {
          			case <-disconnectTimer.C:
          			default:
          			}
          		}
          		disconnectTimer = nil
          		disconnectC = nil
          	}
          	defer stopDisconnectTimer()

          	for {
          		select {
          		case <-ctx.Done():
          			return
          		case <-disconnectC:
          			if !m.isCurrentSession(session) {
          				return
          			}
          			m.log.Error("WebRTC peer remained disconnected past grace period", "call_id", session.ID)
          			m.signalTerminate(session, waAccount)
          			m.endSession(session, "peer_disconnected_timeout", "monitorPeerConnection")
          			return
          		case state := <-stateEvents:
          			switch state {
          			case webrtc.PeerConnectionStateConnected:
          				stopDisconnectTimer()
          			case webrtc.PeerConnectionStateDisconnected:
          				if disconnectTimer == nil {
          					disconnectTimer = time.NewTimer(8 * time.Second)
          					disconnectC = disconnectTimer.C
          				}
          			case webrtc.PeerConnectionStateFailed:
          				if !m.isCurrentSession(session) {
          					return
          				}
          				m.signalTerminate(session, waAccount)
          				m.endSession(session, "peer_failed", "monitorPeerConnection")
          				return
          			case webrtc.PeerConnectionStateClosed:
          				// Closed normally confirms our own cleanup. Only treat it as a
          				// failure while this exact session is still the active map entry.
          				if m.isCurrentSession(session) {
          					m.log.Error("Active peer connection closed unexpectedly", "call_id", session.ID)
          					m.signalTerminate(session, waAccount)
          					m.endSession(session, "unexpected_peer_closed", "monitorPeerConnection")
          				}
          				return
          			}
          		}
          	}
          }

          // waitForICEGathering waits for ICE gathering to complete on a PeerConnection
          '''
          if old_tail not in text:
              raise SystemExit("webrtc.go: tail block not found")
          p.write_text(text.replace(old_tail, new_tail, 1))

          Path("internal/calling/lifecycle.go").write_text(r'''package calling

          import (
          	"sync"
          	"time"

          	"github.com/shridarpatil/whatomate/internal/models"
          )

          type sessionTermination struct {
          	once sync.Once
          }

          var sessionTerminations sync.Map // map[*CallSession]*sessionTermination

          func (m *Manager) isCurrentSession(session *CallSession) bool {
          	if session == nil {
          		return false
          	}
          	m.mu.RLock()
          	current, exists := m.sessions[session.ID]
          	m.mu.RUnlock()
          	return exists && current == session
          }

          func (m *Manager) endSession(session *CallSession, reason, initiator string) {
          	if session == nil {
          		return
          	}

          	value, _ := sessionTerminations.LoadOrStore(session, &sessionTermination{})
          	termination := value.(*sessionTermination)
          	termination.once.Do(func() {
          		if !m.isCurrentSession(session) {
          			m.log.Info("Ignoring stale call cleanup",
          				"call_id", session.ID,
          				"reason", reason,
          				"initiator", initiator,
          			)
          			sessionTerminations.Delete(session)
          			return
          		}

          		session.mu.Lock()
          		startedAt := session.StartedAt
          		if session.Cancel != nil {
          			session.Cancel()
          		}
          		session.Status = models.CallStatusCompleted
          		session.mu.Unlock()

          		m.log.Info("Ending call session",
          			"call_id", session.ID,
          			"reason", reason,
          			"initiator", initiator,
          			"age_ms", time.Since(startedAt).Milliseconds(),
          		)

          		m.cleanupSession(session.ID)
          		sessionTerminations.Delete(session)
          	})
          }

          func (m *Manager) endCurrentSessionByID(callID, reason, initiator string) {
          	if callID == "" {
          		return
          	}
          	if session := m.GetSession(callID); session != nil {
          		m.endSession(session, reason, initiator)
          	}
          }
          ''')

          Path("internal/calling/safety.go").write_text(r'''package calling

          import (
          	"context"
          	"runtime/debug"
          	"time"

          	"github.com/pion/webrtc/v4"
          	"github.com/shridarpatil/whatomate/internal/models"
          	"github.com/shridarpatil/whatomate/pkg/whatsapp"
          )

          func isTerminalPeerState(pc *webrtc.PeerConnection) bool {
          	state := pc.ConnectionState()
          	return state == webrtc.PeerConnectionStateFailed || state == webrtc.PeerConnectionStateClosed
          }

          func (m *Manager) recoverAndLog(where, callID string) {
          	if r := recover(); r != nil {
          		m.log.Error("Recovered from panic in call goroutine — call ended, server kept running",
          			"where", where,
          			"call_id", callID,
          			"panic", r,
          			"stack", string(debug.Stack()),
          		)
          		m.endCurrentSessionByID(callID, "panic_recovered", where)
          	}
          }

          func (m *Manager) safeGo(where, callID string, fn func()) {
          	go func() {
          		defer m.recoverAndLog(where, callID)
          		fn()
          	}()
          }

          func (m *Manager) signalReject(session *CallSession, waAccount *whatsapp.Account) {
          	ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
          	defer cancel()
          	m.rejectCall(ctx, waAccount, session.ID)
          }

          func (m *Manager) signalTerminate(session *CallSession, waAccount *whatsapp.Account) {
          	m.terminateCall(session, waAccount)
          }

          func (m *Manager) StartWatchdog(ctx context.Context) {
          	const checkInterval = 15 * time.Second
          	ticker := time.NewTicker(checkInterval)
          	defer ticker.Stop()
          	m.log.Info("Call session watchdog started", "interval", checkInterval.String())

          	for {
          		select {
          		case <-ctx.Done():
          			m.log.Info("Call session watchdog stopped")
          			return
          		case <-ticker.C:
          			m.sweepStuckSessions()
          		}
          	}
          }

          func (m *Manager) sweepStuckSessions() {
          	defer m.recoverAndLog("sweepStuckSessions", "")

          	maxDuration := time.Duration(m.config.MaxCallDuration) * time.Second
          	if maxDuration <= 0 {
          		maxDuration = time.Hour
          	}
          	const maxNegotiationAge = 90 * time.Second
          	const absoluteMaxAge = 6 * time.Hour
          	now := time.Now()

          	// Snapshot manager state first, then inspect sessions after releasing
          	// m.mu. This removes the manager/session lock-order deadlock.
          	m.mu.RLock()
          	sessions := make([]*CallSession, 0, len(m.sessions))
          	for _, session := range m.sessions {
          		sessions = append(sessions, session)
          	}
          	m.mu.RUnlock()

          	var stuck []*CallSession
          	for _, session := range sessions {
          		session.mu.Lock()
          		age := now.Sub(session.StartedAt)
          		status := session.Status
          		peer := session.PeerConnection
          		ctxDone := false
          		if session.Context != nil {
          			select {
          			case <-session.Context.Done():
          				ctxDone = true
          			default:
          			}
          		}
          		session.mu.Unlock()

          		switch {
          		case ctxDone && age > 5*time.Second:
          			stuck = append(stuck, session)
          		case age > absoluteMaxAge:
          			stuck = append(stuck, session)
          		case status != models.CallStatusAnswered && age > maxNegotiationAge:
          			stuck = append(stuck, session)
          		case peer != nil && isTerminalPeerState(peer) && age > 5*time.Second:
          			stuck = append(stuck, session)
          		}
          	}

          	for _, session := range stuck {
          		if !m.isCurrentSession(session) {
          			continue
          		}
          		m.log.Error("Watchdog force-cleaning stuck call session",
          			"call_id", session.ID,
          			"caller", session.CallerPhone,
          			"age_secs", int(now.Sub(session.StartedAt).Seconds()),
          		)
          		m.safeGo("watchdogTerminate", session.ID, func() {
          			m.terminateCallBySession(session)
          		})
          		m.endSession(session, "watchdog_stuck_session", "sweepStuckSessions")
          	}
          }
          ''')

          Path("internal/calling/lifecycle_test.go").write_text(r'''package calling

          import "testing"

          func TestIsCurrentSessionUsesObjectIdentity(t *testing.T) {
          	oldSession := &CallSession{ID: "same-call-id"}
          	currentSession := &CallSession{ID: "same-call-id"}
          	m := &Manager{sessions: map[string]*CallSession{"same-call-id": currentSession}}

          	if m.isCurrentSession(oldSession) {
          		t.Fatal("stale session with reused call ID must not be current")
          	}
          	if !m.isCurrentSession(currentSession) {
          		t.Fatal("registered session should be current")
          	}
          }
          ''')
          PY

          gofmt -w internal/calling/session.go internal/calling/webrtc.go internal/calling/lifecycle.go internal/calling/safety.go internal/calling/lifecycle_test.go

      - name: Test calling package with race detector
        run: go test -race ./internal/calling/...

      - name: Test complete codebase
        run: go test ./...

      - name: Commit directly to main
        shell: bash
        run: |
          rm -f .github/workflows/apply-ivr-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(calling): make IVR call lifecycle stable and concurrency-safe"
          git push origin HEAD:main
