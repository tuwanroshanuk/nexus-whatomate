name: Apply extended TTS settings

on:
  push:
    paths:
      - .github/workflows/apply-tts-settings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation
        run: python .github/scripts/apply_tts_settings.py
      - name: Format Go
        run: gofmt -w internal/tts/piper.go internal/tts/piper_test.go internal/calling/runtime_tts.go internal/config/config.go internal/handlers/tts_settings.go internal/handlers/ivr_flows.go cmd/whatomate/main.go
      - name: Test TTS and calling backend
        run: go test ./internal/tts ./internal/calling ./internal/handlers ./cmd/whatomate
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check changed frontend files
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          cat /tmp/typecheck.log
          if grep -E 'TTSSettingsPanel\.vue|IVRNodeProperties\.vue|SettingsView\.vue|services/api\.ts' /tmp/typecheck.log; then
            exit 1
          fi
          echo "Full repository typecheck exit code: $code (pre-existing unrelated errors are tolerated here)."
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit implementation to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extend TTS settings, models and digit pronunciation"
          git push origin HEAD:main
