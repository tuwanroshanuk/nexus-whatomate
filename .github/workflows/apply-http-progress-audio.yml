name: Apply HTTP progress audio

on:
  push:
    paths:
      - .github/scripts/apply_http_progress_audio.py
      - .github/workflows/apply-http-progress-audio.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply implementation
        run: python .github/scripts/apply_http_progress_audio.py

      - name: Format Go
        run: gofmt -w internal/calling/ivr.go

      - name: Test backend
        run: go test ./internal/calling ./internal/handlers ./cmd/whatomate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check changed frontend files
        working-directory: frontend
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          set -e
          cat /tmp/typecheck.log
          if grep -E 'src/components/calling/IVRNodeProperties\.vue|src/views/calling/IVRFlowEditorView\.vue' /tmp/typecheck.log; then
            echo 'TypeScript errors found in changed IVR files.'
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo 'Full typecheck still has pre-existing errors outside the changed IVR files; continuing.'
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit implementation to main
        run: |
          rm -f .github/scripts/apply_http_progress_audio.py .github/workflows/apply-http-progress-audio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/calling/ivr.go frontend/src/components/calling/IVRNodeProperties.vue frontend/src/views/calling/IVRFlowEditorView.vue .github/scripts/apply_http_progress_audio.py .github/workflows/apply-http-progress-audio.yml
          git commit -m 'Add optional HTTP progress audio' || exit 0
          git push origin main
