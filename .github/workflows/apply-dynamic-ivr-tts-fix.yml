name: Apply dynamic IVR TTS fix

on:
  push:
    paths:
      - .github/workflows/apply-dynamic-ivr-tts-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply runtime TTS interpolation fix
        run: python .github/scripts/apply_dynamic_ivr_tts_fix.py

      - name: Format Go files
        run: gofmt -w internal/calling/ivr.go internal/calling/runtime_tts.go internal/handlers/ivr_flows.go cmd/whatomate/main.go

      - name: Compile and test affected packages
        run: go test ./internal/calling ./cmd/whatomate

      - name: Commit fix to main
        run: |
          rm -f .github/workflows/apply-dynamic-ivr-tts-fix.yml
          rm -f .github/scripts/apply_dynamic_ivr_tts_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix runtime IVR TTS variable interpolation"
          git push origin HEAD:main
