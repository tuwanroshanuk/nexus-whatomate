name: Apply dark pink theme

on:
  push:
    paths:
      - .github/workflows/apply-dark-pink-theme.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Replace green, emerald and teal UI accents with dark pink
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('frontend/src')
          extensions = {'.vue', '.ts', '.tsx', '.js', '.jsx', '.css', '.html'}

          # Replace Tailwind hue families everywhere in frontend source. This catches
          # backgrounds, text, borders, gradients, shadows, rings, hover/focus states,
          # fill/stroke and arbitrary opacity variants while preserving shade values.
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in extensions:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'(?<=-)(?:green|emerald|teal)(?=-)', 'pink', text)

              # Replace common literal Tailwind green/emerald/teal palette colors.
              palette = {
                  '#f0fdf4':'#fdf2f8', '#dcfce7':'#fce7f3', '#bbf7d0':'#fbcfe8', '#86efac':'#f9a8d4',
                  '#4ade80':'#f472b6', '#22c55e':'#ec4899', '#16a34a':'#db2777', '#15803d':'#be185d',
                  '#166534':'#9d174d', '#14532d':'#831843', '#052e16':'#500724',
                  '#ecfdf5':'#fdf2f8', '#d1fae5':'#fce7f3', '#a7f3d0':'#fbcfe8', '#6ee7b7':'#f9a8d4',
                  '#34d399':'#f472b6', '#10b981':'#ec4899', '#059669':'#db2777', '#047857':'#be185d',
                  '#065f46':'#9d174d', '#064e3b':'#831843', '#022c22':'#500724',
                  '#f0fdfa':'#fdf2f8', '#ccfbf1':'#fce7f3', '#99f6e4':'#fbcfe8', '#5eead4':'#f9a8d4',
                  '#2dd4bf':'#f472b6', '#14b8a6':'#ec4899', '#0d9488':'#db2777', '#0f766e':'#be185d',
                  '#115e59':'#9d174d', '#134e4a':'#831843', '#042f2e':'#500724',
              }
              for old, new in palette.items():
                  text = re.sub(re.escape(old), new, text, flags=re.IGNORECASE)

              # Existing base theme used emerald HSL/RGBA values. Make those dark pink
              # so native focus/select states cannot fall back to green.
              text = text.replace('160 84% 39%', '335 79% 42%')
              text = text.replace('rgba(16, 185, 129,', 'rgba(190, 24, 93,')
              text = text.replace('rgb(16 185 129 /', 'rgb(190 24 93 /')

              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Goto Flow is the reference dark-pink IVR node header.
          goto = Path('frontend/src/components/calling/nodes/GotoFlowNode.vue')
          text = goto.read_text(encoding='utf-8')
          text = re.sub(r'header-class="bg-[^"]+"', 'header-class="bg-pink-700"', text, count=1)
          goto.write_text(text, encoding='utf-8')

          # Rewrite Nexus green compatibility overrides to dark pink instead of blue.
          theme = Path('frontend/src/assets/nexus-theme.css')
          text = theme.read_text(encoding='utf-8')
          # The replacement above renamed green families to pink; now make the compatibility
          # block use pink values. Do not alter the global Nexus blue primary itself.
          marker = '/* Brand gradients and shadows */'
          chat_marker = '/* Chat accents */'
          if marker in text and chat_marker in text:
              before, rest = text.split(marker, 1)
              middle, after = rest.split(chat_marker, 1)
              middle = middle.replace('#0738f9', '#be185d').replace('#052ac4', '#9d174d').replace('#315cff', '#db2777')
              middle = middle.replace('rgb(7 56 249 /', 'rgb(190 24 93 /').replace('rgba(7, 56, 249,', 'rgba(190, 24, 93,')
              text = before + marker + middle + chat_marker + after
              theme.write_text(text, encoding='utf-8')

          print('Remaining green-family Tailwind references:')
          for path in root.rglob('*'):
              if path.is_file() and path.suffix in extensions:
                  txt = path.read_text(encoding='utf-8')
                  if re.search(r'-(green|emerald|teal)-', txt):
                      print(path)
          PY

      - name: Verify no green-family UI utilities remain
        shell: bash
        run: |
          if grep -RInE --include='*.vue' --include='*.ts' --include='*.css' -- '-(green|emerald|teal)-' frontend/src; then
            echo 'Green-family Tailwind utility remains.'
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit dark pink theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-dark-pink-theme.yml
          git add -A
          git commit -m "Replace green accents with dark pink across app"
          git push origin HEAD:main
