name: Apply IVR visual variable builder

on:
  push:
    paths:
      - .github/workflows/apply-ivr-variable-builder.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply implementation
        shell: python {0}
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected snippet not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          # -----------------------------------------------------------------
          # Runtime HTTP JSON flattening
          # -----------------------------------------------------------------
          replace_once(
              "internal/calling/ivr.go",
              '''\tif responseStoreAs != "" {\n\t\tctx.Variables[responseStoreAs] = result.Body\n\t}\n''',
              '''\tif responseStoreAs != "" {\n\t\t// Preserve the raw response for backwards compatibility.\n\t\tctx.Variables[responseStoreAs] = result.Body\n\n\t\t// JSON responses are additionally flattened into dot-path variables so\n\t\t// downstream IVR nodes can reference values such as\n\t\t// {{accountInfo.profile.name}} and {{accountInfo.projects.0.name}}.\n\t\tvar parsed any\n\t\tif err := json.Unmarshal([]byte(result.Body), &parsed); err == nil {\n\t\t\tflattenJSONVariables(responseStoreAs, parsed, ctx.Variables)\n\t\t}\n\t}\n'''
          )

          replace_once(
              "internal/calling/ivr.go",
              '''\n// executeTransfer routes the call to an agent team. If the transfer node has\n''',
              '''\n// flattenJSONVariables exposes primitive JSON leaves as dot-path IVR variables.\n// Arrays use numeric path segments (for example projects.0.name). The raw HTTP\n// response remains stored under response_store_as by executeHTTPCallback.\nfunc flattenJSONVariables(prefix string, value any, vars map[string]string) {\n\tswitch v := value.(type) {\n\tcase map[string]any:\n\t\tfor key, child := range v {\n\t\t\tchildPrefix := key\n\t\t\tif prefix != "" {\n\t\t\t\tchildPrefix = prefix + "." + key\n\t\t\t}\n\t\t\tflattenJSONVariables(childPrefix, child, vars)\n\t\t}\n\tcase []any:\n\t\tfor i, child := range v {\n\t\t\tflattenJSONVariables(fmt.Sprintf("%s.%d", prefix, i), child, vars)\n\t\t}\n\tcase string:\n\t\tvars[prefix] = v\n\tcase float64, bool:\n\t\tvars[prefix] = fmt.Sprint(v)\n\tcase nil:\n\t\tvars[prefix] = ""\n\tdefault:\n\t\tvars[prefix] = fmt.Sprint(v)\n\t}\n}\n\n// executeTransfer routes the call to an agent team. If the transfer node has\n'''
          )

