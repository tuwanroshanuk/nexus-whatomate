name: Apply IVR visual variable builder

on:
  push:
    paths:
      - .github/workflows/apply-ivr-variable-builder.yml
      - .github/scripts/apply_ivr_variable_builder.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply implementation
        run: python .github/scripts/apply_ivr_variable_builder.py

      - name: Format Go
        run: gofmt -w internal/calling/ivr.go internal/calling/ivr_variables_test.go internal/handlers/ivr_flows.go cmd/whatomate/main.go

      - name: Test backend
        run: go test ./internal/calling ./internal/handlers ./cmd/whatomate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit implementation to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add visual IVR HTTP variables and dynamic TTS tags"
          git push origin HEAD:main
