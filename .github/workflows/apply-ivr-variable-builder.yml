    groups.get(variable.source)!.push(variable)
  }
  return Array.from(groups.entries()).map(([source, variables]) => ({ source, variables }))
})

function choose(variable: IVRVariableDefinition) {
  emit('select', variable)
  open.value = false
  search.value = ''
}
