name: Apply mobile push bootstrap

on:
  push:
    paths:
      - .github/workflows/mobile-push-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize mobile push at server startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cmd/whatomate/main.go')
          text = p.read_text()
          needle = '''\twsHub := websocket.NewHub(lo)\n\tgo wsHub.Run()\n\tlo.Info("WebSocket hub started")\n'''
          replacement = '''\twsHub := websocket.NewHub(lo)\n\twebsocket.EnsureMobilePush(db, lo)\n\tgo wsHub.Run()\n\tlo.Info("WebSocket hub started")\n'''
          if 'websocket.EnsureMobilePush(db, lo)' not in text:
              if needle not in text:
                  raise SystemExit('WebSocket bootstrap block not found')
              p.write_text(text.replace(needle, replacement, 1))
          PY
          gofmt -w cmd/whatomate/main.go internal/websocket/client.go internal/websocket/hub.go internal/websocket/mobile_push.go internal/websocket/push_protocol.go internal/handlers/websocket.go
      - name: Compile and test websocket package
        run: go test ./internal/websocket
      - name: Compile handlers
        run: go test ./internal/handlers
      - name: Commit validated bootstrap
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/whatomate/main.go internal/websocket internal/handlers/websocket.go
          git commit -m "feat: initialize mobile push on server startup"
          git push
