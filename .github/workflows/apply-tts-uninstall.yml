name: Apply TTS model uninstall

on:
  push:
    paths:
      - .github/workflows/apply-tts-uninstall.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply uninstall implementation
        run: python .github/scripts/apply_tts_uninstall.py
      - name: Format Go
        run: gofmt -w internal/tts/piper.go internal/handlers/tts_settings.go cmd/whatomate/main.go
      - name: Test backend
        run: go test ./internal/tts ./internal/handlers ./cmd/whatomate
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit implementation to main
        run: |
          rm -f .github/scripts/apply_tts_uninstall.py .github/workflows/apply-tts-uninstall.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add safe TTS model uninstall and disk cleanup"
          git push origin HEAD:main
